<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF a Excel</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--ac:#1d6f42;--acx:#fff;--bd:#d9dde3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mut:#98a2b3;--ac:#3fb871;--acx:#0b1a11;--bd:#333a42;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mut:#98a2b3;--ac:#3fb871;--acx:#0b1a11;--bd:#333a42;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label.drop{display:block;border:2px dashed var(--bd);border-radius:12px;padding:26px 12px;text-align:center;cursor:pointer;color:var(--mut)}
label.drop b{color:var(--tx);display:block;font-size:1.05rem;word-break:break-all}
input[type=file]{display:none}
.opt{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:.95rem}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-size:1rem;font-weight:600}
button:disabled{opacity:.45}
#st{color:var(--mut);font-size:.92rem;margin-top:10px;min-height:1.2em}
.err{color:#c0392b}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;font-size:.8rem;white-space:nowrap}
td{border:1px solid var(--bd);padding:4px 8px}
tr:first-child td{font-weight:600}
h2{font-size:1.05rem;margin:0 0 10px}
</style></head>
<body><main>
<h1>PDF a Excel</h1>
<p class="s">Subí un PDF y se genera un Excel con filas y columnas según lo que se lee en el documento.</p>

<div class="card">
<label class="drop" for="f"><b id="fn">Tocá para elegir un PDF</b><span id="fs">Se procesa en tu dispositivo, no se sube a ningún servidor</span></label>
<input type="file" id="f" accept="application/pdf,.pdf">
<label class="opt"><input type="checkbox" id="pp"> Una hoja de Excel por cada página</label>
<button id="go" disabled>Convertir</button>
<div id="st"></div>
</div>

<div class="card" id="res" hidden>
<h2>Vista previa</h2>
<div class="wrap"><table id="tb"></table></div>
<button id="dl">Descargar Excel</button>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let file=null,wb=null,dls=null;
const st=(t,e)=>{$('st').textContent=t;$('st').className=e?'err':''};
try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}

(async()=>{try{dls=await claude.use('downloads')}catch(e){dls=null}})();

$('f').onchange=e=>{
  file=e.target.files[0]||null;
  $('res').hidden=true;
  if(file){$('fn').textContent=file.name;$('fs').textContent=(file.size/1024).toFixed(0)+' KB';$('go').disabled=false;st('')}
};

function num(s){
  const t=s.trim();
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t))return parseFloat(t.replace(/\./g,'').replace(',','.'));
  if(/^-?(0|[1-9]\d*),\d+$/.test(t))return parseFloat(t.replace(',','.'));
  if(/^-?(0|[1-9]\d*)(\.\d+)?$/.test(t))return parseFloat(t);
  return s;
}

function buildRows(items){
  items.sort((a,b)=>b.y-a.y||a.x-b.x);
  const lines=[];
  for(const it of items){
    const l=lines[lines.length-1];
    if(l&&Math.abs(l.y-it.y)<=Math.max(2,it.h*0.4))l.it.push(it);else lines.push({y:it.y,it:[it]});
  }
  const cl=lines.map(l=>{
    l.it.sort((a,b)=>a.x-b.x);
    const cells=[];let c=null;
    for(const it of l.it){
      const gap=c?it.x-c.x2:0;
      if(c&&gap<it.h*0.9){
        c.s+=(gap>it.h*0.15&&!c.s.endsWith(' ')&&!it.s.startsWith(' ')?' ':'')+it.s;c.x2=it.x+it.w;
      }else{c={s:it.s,x:it.x,x2:it.x+it.w};cells.push(c)}
    }
    cells.forEach(k=>k.s=k.s.replace(/\s+/g,' ').trim());
    return cells.filter(k=>k.s);
  }).filter(c=>c.length);
  let starts=[];
  cl.forEach(c=>{if(c.length>1)c.forEach(k=>starts.push(k.x))});
  if(!starts.length)cl.forEach(c=>c.forEach(k=>starts.push(k.x)));
  starts.sort((a,b)=>a-b);
  const anchors=[];
  for(const x of starts){if(!anchors.length||x-anchors[anchors.length-1].last>8)anchors.push({x,last:x});else anchors[anchors.length-1].last=x}
  const ax=anchors.map(a=>a.x);
  return cl.map(c=>{
    const row=[];
    for(const k of c){
      let i=0;
      for(let j=0;j<ax.length;j++)if(ax[j]<=k.x+8)i=j;
      while(row[i]!==undefined)i++;
      row[i]=k.s;
    }
    return Array.from(row,v=>v===undefined?'':num(v));
  });
}

$('go').onclick=async()=>{
  if(!file)return;
  if(typeof pdfjsLib==='undefined'||typeof XLSX==='undefined'){st('No se pudieron cargar las librerías. Revisá la conexión y recargá.',1);return}
  $('go').disabled=true;$('res').hidden=true;
  try{
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const pages=[];
    for(let p=1;p<=pdf.numPages;p++){
      st('Leyendo página '+p+' de '+pdf.numPages+'…');
      const tc=await (await pdf.getPage(p)).getTextContent();
      const items=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width,h:Math.abs(i.transform[3])||10}));
      pages.push(buildRows(items));
    }
    if(!pages.some(r=>r.length)){st('El PDF no tiene texto seleccionable (probablemente es un escaneo o imagen). Hace falta OCR para leerlo.',1);$('go').disabled=false;return}
    wb=XLSX.utils.book_new();
    const mk=rows=>{
      const ws=XLSX.utils.aoa_to_sheet(rows);
      const n=Math.max(...rows.map(r=>r.length));
      ws['!cols']=Array.from({length:n},(_,c)=>({wch:Math.min(50,Math.max(8,...rows.map(r=>String(r[c]??'').length))+2)}));
      return ws;
    };
    if($('pp').checked){
      pages.forEach((r,i)=>{if(r.length)XLSX.utils.book_append_sheet(wb,mk(r),'Página '+(i+1))});
    }else{
      XLSX.utils.book_append_sheet(wb,mk(pages.flat()),'Datos');
    }
    const first=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).slice(0,30);
    const tb=$('tb');tb.textContent='';
    first.forEach(r=>{const tr=tb.insertRow();r.forEach(v=>{tr.insertCell().textContent=v})});
    $('res').hidden=false;
    st('Listo: '+wb.SheetNames.length+' hoja(s). Revisá la vista previa y descargá.');
    $('res').scrollIntoView({behavior:'smooth'});
  }catch(e){st('Error al leer el PDF: '+(e&&e.message||e),1)}
  $('go').disabled=false;
};

$('dl').onclick=async()=>{
  if(!wb)return;
  const nombre=file.name.replace(/\.pdf$/i,'')+'.xlsx';
  if(!dls){
    try{XLSX.writeFile(wb,nombre);st('Archivo descargado.')}catch(e){st('No se pudo descargar el archivo.',1)}
    return;
  }
  try{
    const data=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    await dls.save({filename:file.name.replace(/\.pdf$/i,'')+'.xlsx',data});
    st('Archivo guardado.');
  }catch(e){
    if(e&&e.code==='declined')st('Descarga cancelada.');
    else st('No se pudo guardar el archivo ('+(e&&e.code||'error')+').',1);
  }
};
</script>
</body></html>
